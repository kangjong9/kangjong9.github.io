 <path d="M203 92Q219 119 204 146L174 153" fill="none" stroke="#254452" stroke-width="6" stroke-linecap="round"/><rect x="163" y="147" width="21" height="11" rx="5" fill="#254452"/>
 <path d="M16 101L23 108M22 91L28 94M11 114L19 116" stroke="#0b9fa9" stroke-width="3" stroke-linecap="round"/>
</svg>

  <g font-family="'Pretendard','Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
    <text x="164" y="44" fill="#087F8C" font-size="10.5" font-weight="900" letter-spacing="1.6">ANDROMEDA EXILE AI</text>
    <text x="162" y="82" fill="#17324D" font-size="32" font-weight="900" letter-spacing="-1">한걸음 <tspan fill="#087F8C">Exile</tspan></text>
    <text x="164" y="106" fill="#5C7180" font-size="13.5" font-weight="700">안드로메다에서 유배 온</text>
    <text x="164" y="125" fill="#5C7180" font-size="13.5" font-weight="700">안내 AI <tspan fill="#087F8C" font-weight="900">Exile</tspan>과 50단계</text>

    <!-- 6개 언어 -->
    <g font-size="13" font-weight="800" fill="#17324D" text-anchor="middle">
      <rect x="164" y="138" width="70" height="26" rx="13" fill="#FFF1C7"/><text x="199" y="156">영어</text><rect x="240" y="138" width="70" height="26" rx="13" fill="#FFE0E6"/><text x="275" y="156">일본어</text><rect x="316" y="138" width="70" height="26" rx="13" fill="#FFE3D6"/><text x="351" y="156">중국어</text><rect x="164" y="170" width="70" height="26" rx="13" fill="#DCEBFF"/><text x="199" y="188">프랑스어</text><rect x="240" y="170" width="70" height="26" rx="13" fill="#FFEBD1"/><text x="275" y="188">스페인어</text><rect x="316" y="170" width="70" height="26" rx="13" fill="#E3E4FF"/><text x="351" y="188">러시아어</text>
    </g>

    <!-- TTS 엔진 -->
    <rect x="18" y="208" width="364" height="36" rx="13" fill="#087F8C"/>
    <g fill="#FFFFFF" transform="translate(98 217)">
      <rect x="0" y="0" width="8" height="12" rx="4"/>
      <path d="M-3 8 A7 7 0 0 0 11 8" stroke="#FFFFFF" stroke-width="2" fill="none"/>
      <rect x="3" y="15" width="2" height="4"/>
    </g>
    <text x="212" y="232" fill="#FFFFFF" font-size="16" font-weight="900" text-anchor="middle">누리 보이스 TTS 엔진 탑재</text>
  </g>
