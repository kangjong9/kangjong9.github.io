<svg xmlns="http://www.w3.org/2000/svg" width="400" height="260" viewBox="0 0 400 260">
  <!-- 홈페이지 프로젝트 카드(한걸음 Exile, UI 리뉴얼 V3.1 톤). 원본은 여기, publish_nuri_voice.py가 assets/projects/hangeoreum.svg로 배포한다.
       카드는 화면에서 절반 가까이 줄어 보이므로 글자는 크게, 내용은 '안드로메다 유배 + 6개 언어 + TTS 엔진'만.
       여우 그림은 app/src/main/assets/images/hg-guide-fox.svg를 그대로 넣었다(img로 표시되므로 외부 참조 불가). -->
  <defs>
    <radialGradient id="bg" cx=".25" cy=".1" r="1.1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".55" stop-color="#E9F8F5"/>
      <stop offset="1" stop-color="#CDEDE6"/>
    </radialGradient>
  </defs>
  <rect width="400" height="260" rx="24" fill="url(#bg)"/>

  <!-- 안드로메다 별빛 -->
  <g fill="#087F8C" opacity=".28"><circle cx="30" cy="26" r="2.2"/><circle cx="378" cy="22" r="2.6"/><circle cx="152" cy="18" r="1.6"/><circle cx="388" cy="118" r="1.8"/></g>
  <g fill="#E97556" opacity=".35"><circle cx="128" cy="40" r="1.8"/><circle cx="22" cy="190" r="1.6"/></g>
  <path d="M352 50 L354 44 L356 50 L362 52 L356 54 L354 60 L352 54 L346 52 Z" fill="#087F8C" opacity=".45"/>

