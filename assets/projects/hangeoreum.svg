<svg xmlns="http://www.w3.org/2000/svg" width="400" height="260" viewBox="0 0 400 260">
  <!-- 홈페이지 프로젝트 카드(한걸음V1.0 Exile). 원본은 여기, publish_nuri_voice.py가 assets/projects/hangeoreum.svg로 배포한다.
       카드는 화면에서 절반 가까이 줄어 보이므로 글자는 크게, 내용은 '안드로메다 유배 + 6개 언어 + TTS 엔진'만. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1026"/>
      <stop offset=".55" stop-color="#1E1B4B"/>
      <stop offset="1" stop-color="#3B0764"/>
    </linearGradient>
    <radialGradient id="galaxy" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#FDF4FF" stop-opacity=".95"/>
      <stop offset=".25" stop-color="#C4B5FD" stop-opacity=".6"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FDE047" stop-opacity=".55"/>
      <stop offset="1" stop-color="#FDE047" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="400" height="260" rx="24" fill="url(#sky)"/>

  <!-- 안드로메다 은하 -->
  <g transform="rotate(-28 340 48)">
    <ellipse cx="340" cy="48" rx="62" ry="17" fill="url(#galaxy)"/>
    <ellipse cx="340" cy="48" rx="34" ry="8" fill="#F5D0FE" opacity=".55"/>
  </g>
  <!-- 별 -->
  <g fill="#FFFFFF">
    <circle cx="34" cy="30" r="1.6"/><circle cx="92" cy="18" r="1.1"/><circle cx="58" cy="70" r="1.2"/>
    <circle cx="140" cy="40" r="1"/><circle cx="262" cy="22" r="1.3"/><circle cx="380" cy="104" r="1.2"/>
    <circle cx="22" cy="118" r="1"/><circle cx="300" cy="86" r="1"/>
  </g>
  <path d="M60 40 L62 34 L64 40 L70 42 L64 44 L62 50 L60 44 L54 42 Z" fill="#FDE047"/>

  <!-- UFO (엑자일) -->
  <path d="M187 44 L213 44 L226 74 L174 74 Z" fill="url(#beam)"/>
  <ellipse cx="200" cy="30" rx="13" ry="11" fill="#38BDF8"/>
  <ellipse cx="196" cy="26" rx="4" ry="3" fill="#E0F2FE"/>
  <ellipse cx="200" cy="38" rx="32" ry="9" fill="#94A3B8"/>
  <ellipse cx="200" cy="36" rx="32" ry="6" fill="#CBD5E1"/>
  <g fill="#1E293B"><circle cx="180" cy="39" r="2"/><circle cx="190" cy="41" r="2"/><circle cx="200" cy="42" r="2"/><circle cx="210" cy="41" r="2"/><circle cx="220" cy="39" r="2"/></g>

  <g font-family="'Pretendard','Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" text-anchor="middle">
    <text x="200" y="68" fill="#818CF8" font-size="11" font-weight="800" letter-spacing="2.5">ANDROMEDA EXILE AI PROJECT</text>
    <text x="200" y="101" fill="#FFFFFF" font-size="30" font-weight="900" letter-spacing="-0.5">한걸음 V1.0 <tspan fill="#A5B4FC">Exile</tspan></text>
    <text x="200" y="127" fill="#E0E7FF" font-size="15" font-weight="700">안드로메다에서 유배 온 AI 튜터 엑자일</text>

    <!-- 6개 언어 -->
    <g font-size="15" font-weight="800" fill="#0F172A">
      <rect x="24" y="140" width="112" height="28" rx="14" fill="#FDE68A"/><text x="80" y="159">영어</text>
      <rect x="144" y="140" width="112" height="28" rx="14" fill="#FBCFE8"/><text x="200" y="159">일본어</text>
      <rect x="264" y="140" width="112" height="28" rx="14" fill="#FECACA"/><text x="320" y="159">중국어</text>
      <rect x="24" y="174" width="112" height="28" rx="14" fill="#BFDBFE"/><text x="80" y="193">프랑스어</text>
      <rect x="144" y="174" width="112" height="28" rx="14" fill="#FED7AA"/><text x="200" y="193">스페인어</text>
      <rect x="264" y="174" width="112" height="28" rx="14" fill="#C7D2FE"/><text x="320" y="193">러시아어</text>
    </g>

    <!-- TTS 엔진 -->
    <rect x="24" y="212" width="352" height="34" rx="12" fill="#38BDF8" fill-opacity=".16" stroke="#38BDF8" stroke-width="1.5"/>
    <g fill="#7DD3FC" transform="translate(86 220)">
      <rect x="0" y="0" width="8" height="12" rx="4"/>
      <path d="M-3 8 A7 7 0 0 0 11 8" stroke="#7DD3FC" stroke-width="2" fill="none"/>
      <rect x="3" y="15" width="2" height="4"/>
    </g>
    <text x="208" y="235" fill="#FFFFFF" font-size="16" font-weight="900">누리 보이스 TTS 엔진 탑재</text>
  </g>
</svg>
