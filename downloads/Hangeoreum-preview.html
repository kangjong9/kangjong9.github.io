/* SOW-LANG-001 5-Stage Zero-Base Architecture Styles */
.stageTabs{display:flex;gap:6px;overflow-x:auto;padding:6px 0 16px;scrollbar-width:none}
.stageTabs button{flex:0 0 auto;min-height:40px;padding:6px 14px;border-radius:20px;font-size:13px;font-weight:600}
.stageTabs button.active{background:var(--green);color:#fff;border-color:var(--green)}
.mouthCard{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;text-align:center;margin:16px 0}
.mouthSvg{width:140px;height:90px;margin:0 auto;display:block}
.mouthSvg .lips{fill:#fca5a5;stroke:#e11d48;stroke-width:3;transition:all .25s ease}
.mouthSvg .teeth{fill:#fff;stroke:#e2e8f0;stroke-width:1.5}
.mouthSvg .tongue{fill:#f43f5e;opacity:.9}
.mouthActive .lips{transform-origin:center;animation:mouthPulse .4s ease-in-out infinite alternate}
@keyframes mouthPulse{0%{transform:scale(1)}100%{transform:scale(1.15,1.25)}}
.phonemeGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:10px;margin:16px 0}
.phonemeCard{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:75px;padding:10px;border-radius:12px;border:1.5px solid var(--line);background:#fff;cursor:pointer;transition:transform .15s,border-color .15s}
.phonemeCard:hover,.phonemeCard.selected{border-color:var(--green);transform:translateY(-2px);background:var(--tint)}
.phonemeCard .symbol{font-size:24px;font-weight:700;color:var(--green)}
.phonemeCard .ipa{font-size:12px;color:var(--sub);margin-top:4px}
.quizCardGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:20px 0}
.quizCard{min-height:90px;font-size:26px;font-weight:700;border-radius:14px;border:2px solid var(--line);background:#fff;cursor:pointer;transition:all .2s}
.quizCard:hover{border-color:var(--green);background:var(--tint)}
.quizCard.correct{border-color:#16a34a;background:#dcfce7;color:#15803d}

.gaugeFill.blue{background:#2563eb}
.gaugeFill.gold{background:#d97706}

  try { const result=JSON.parse(window.Native.call(command,JSON.stringify(payload))); if(!result.ok) toast(result.error || '요청을 처리하지 못했습니다.'); return result; }
  catch { toast('앱 연결에 실패했습니다. 화면을 다시 열어 주세요.'); return {ok:false}; }
}

function lessonComplete(l) { const done=state.progress[language].lessons?.[l.id]?.practiced||[];return l.phraseIds.length>0&&l.phraseIds.every(id=>done.includes(id)); }
function lesson() { return (unit().lessons||[]).find(l=>l.id===lessonId)||null; }
function scopedPhrases() { const l=lesson();return unit().phrases.map((p,i)=>({p,i})).filter(x=>!l||l.phraseIds.includes(x.p.id)); }
function phraseOptions(kind) { return scopedPhrases().filter(x=>phraseKind(x.p)===kind); }
function nextPracticeIndex(initial=false) {

  const l=lesson(),record=state.progress[language].lessons?.[lessonId],next=nextLesson();
  const done=l?(record?.practiced||[]).filter(id=>l.phraseIds.includes(id)).length:0;
  return `<div class="eyebrow">오늘의 한걸음</div><h1>이번 회차를 마쳤어요.</h1>${!state.admin&&!lastPracticeSaved?'<div class="hint">이번 회차에서 저장할 표현 연습이 없었어요. 듣기나 따라 녹음을 마친 표현만 기록합니다.</div>':''}${illustration('park')}<h2>${escapeHTML(l?.title||unit().title)}</h2><p>${state.admin?'관리자 테스트는 실제 기록에 반영하지 않았어요.':l?done+' / '+l.phraseIds.length+'개 표현을 연습했어요.':'실제 듣거나 따라 녹음한 표현만 복습 노트에 남겼어요.'}</p><p class="muted">${l&&!lessonComplete(l)&&!state.admin?'아직 연습하지 않은 표현은 다음 회차에 이어집니다. ':''}단원 연습 완료와 단계 통과는 달라요.</p><div class="buttonStack">${next?button('nextLesson','다음 단원 · '+escapeHTML(next.title)+' →','primary'):button('startAgain','이 단원 이어서 연습','primary')}${button('home','오늘 화면으로')}${button('lessons','작은 단원 목록')}</div>`;
}

function openExams(){resetSession();exam=null;attempts=[];screen='exams';examRequest('examList');}
function examRequest(command,extra={}){
  if(pending||recording)return;
  const result=bridge(command,{language,epoch:sessionEpoch,...extra});
  if(result.ok){sessionEpoch=result.epoch;pending=true;}else pending=false;
  render();
}
function renderExams(){
 const rows=attempts.filter(a=>a.language===language);
 let html=`<div class="eyebrow">${escapeHTML(data[language].name)} · 서버 평가</div><h1>할 수 있는 만큼,<br>확실하게 확인해요.</h1><p class="muted">검수된 문제가 준비된 단계만 응시할 수 있어요. 녹음 제출은 합격이 아니며 평가가 끝나면 결과가 표시됩니다.</p><div class="row">${button('examBegin','새 시험 시작','primary',pending||state.admin?'disabled':'')}${button('examReload','결과 새로 확인','',pending?'disabled':'')}</div>${pending?'<p role="status">서버에서 확인하고 있어요…</p>':''}`;
 if(!rows.length&&!pending)html+='<p class="section">아직 확인된 시험 기록이 없어요. 서버 연결은 설정에서 할 수 있습니다.</p>';
 for(const row of rows){
  const label={recording:'응시 중',submitted:'제출 완료 · 평가 대기',reviewed:'평가 완료',expired:'응시 기한 종료'}[row.status]||'상태 확인 필요';
  html+=`<section class="section"><span class="tag">${escapeHTML(label)}</span><h2>${Number(row.stage)}단계</h2><p class="muted">${escapeHTML(new Date(row.created*1000).toLocaleString('ko-KR'))}</p>${row.feedback?`<div class="feedback">${escapeHTML(row.feedback)}</div>`:''}${row.scores?`<p>영역별 결과: ${Object.entries(row.scores).map(([k,v])=>escapeHTML(({listening:'듣기',message:'의미 전달',intelligibility:'발음 명료도',grammar:'문법',interaction:'상호 대화',tone_meaning:'성조와 의미',word_order:'어순',mora_meaning:'음의 길이와 의미',particles_forms:'조사와 활용'})[k]||k)+' '+(v===null?'판단 보류':Number(v)+'/4')).join(' · ')}</p>`:''}${row.status==='recording'?button('examResume','이 시험 이어하기','wide',`data-challenge="${escapeHTML(row.id)}" ${pending?'disabled':''}`):''}</section>`;
 }
 return html;
}
function renderExam(){
 if(!exam)return '';
 return `<div class="eyebrow">${escapeHTML(data[language].name)} · ${Number(exam.stage)}단계</div><h1>내 말로 답해 보세요.</h1><div class="phrase"><p>${escapeHTML(exam.prompt.instruction)}</p></div>${exam.prompt.listenText?button('examListen','▶ 문제 음성 듣기','wide',recording||pending?'disabled':''):''}<p class="muted">응시 기한: ${escapeHTML(new Date(exam.expires*1000).toLocaleTimeString('ko-KR'))}. 최대 30초로 답변을 녹음해 주세요.</p><div class="row">${button(recording?'stopRecord':'examRecord',recording?'■ 녹음 끝내기':'● 시험 답변 녹음',recording?'recording':'primary',pending?'disabled':'')}${button('play','내 답변 듣기','',!audioReady||recording||pending?'disabled':'')}</div><p role="status">${recording?'녹음 중':audioReady?'답변이 준비됐어요. 다시 녹음할 수도 있습니다.':'녹음은 제출 전까지 기기에만 있어요.'}</p><div class="section"><label><input id="examConsent" type="checkbox" ${examConsent?'checked':''}> 이 답변 음성을 시험 서버에 보관하고 권한 있는 평가자가 듣고 채점하는 데 동의합니다.</label></div><p class="muted">이 제출은 Google AI에 전송되지 않습니다. 제출 후에는 답변을 교체할 수 없습니다.</p>${button('examSend',pending?'제출 확인 중…':'답변 제출','primary wide',!audioReady||recording||pending?'disabled':'')}<div class="section">${button('exams','시험 목록으로','wide',pending||recording?'disabled':'')}</div>`;
}
</script></body></html>
