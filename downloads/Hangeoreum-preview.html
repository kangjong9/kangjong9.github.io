function bridge(command,payload={}) {
  if (!native) {
    if(command === 'status') return {...state,ok:true};
    if(command === 'open') return {ok:true,epoch:++sessionEpoch};
    if(command === 'cancel') return {ok:true};
    info(command === 'admin' ? '관리자 비밀번호 입력' : 'Android 앱에서 사용해 주세요', command === 'admin' ? '실제 앱에서는 이곳에 비밀번호 입력창이 열립니다. 비밀번호는 설정에서 직접 정하며, 인증하면 모든 단원을 별도 테스트할 수 있습니다.' : '이 화면은 디자인 시안입니다. 기기 음성·녹음·보안 저장·Gemini 연결은 설치한 Android 앱에서 작동합니다.');
    return {ok:false};
  }
  try { const result=JSON.parse(window.Native.call(command,JSON.stringify(payload))); if(!result.ok) toast(result.error || '요청을 처리하지 못했습니다.'); return result; }
  catch { toast('앱 연결에 실패했습니다. 화면을 다시 열어 주세요.'); return {ok:false}; }
}

  } else if(step===2) {

  } else {

function recordControls() { return `<div class="buttonStack">${button(recording?'stopRecord':'record',recording?'■ 녹음 끝내기':'● 내 목소리 녹음',recording?'recording':'',pending&&!recording?'disabled':'')}</div><p class="muted" role="status">${recording?'지금 녹음 중 · 30초 후 자동으로 멈춰요':audioReady?'녹음 준비됨 · 듣거나 분석할 수 있어요':'조용한 곳에서 마이크 가까이 말해 주세요.'}</p>`; }
function openUnit(index) {
  if(index>0&&!state.admin) { info('아직 열리지 않은 단계예요','현재 단계의 듣기·말하기 실력 검증이 먼저 필요합니다. 초안의 정식 승급 평가는 검수 중입니다. 관리자는 비밀번호 인증 후 모든 단원을 볼 수 있습니다.'); return; }
  resetSession(); const result=bridge('open',{language,stage:index+1}); if(!result.ok) return;

function send(mode,useAudio=false,start=false) {
  if(!native) { bridge('chat'); return; }
  if(recording) {toast('녹음을 끝낸 뒤 보내 주세요.');return;}
  const text=start?'이 단원에서 이 주제로 대화하고 싶어요. 먼저 주제가 적절한지 맞춰 주세요.':mode==='shadow'?'첨부한 따라 말하기 녹음을 분석해 주세요.':$('answer')?.value.trim()||'';
  if(!useAudio&&!text) { toast('내 대답을 적거나 녹음해 주세요.'); return; }
  const result=bridge('chat',{epoch:sessionEpoch,topic:topic||unit().title,text,history,mode,useAudio,phraseIndex});
  if(!result.ok) return;
  pending=true;
  if(mode!=='shadow') { messages.push({role:'user',text:useAudio?'내 음성 대답':text}); history.push({role:'user',text:useAudio?'[음성으로 답함]':text}); step=3; }
  render();
}
function updateTimer() { const element=$('timer'); if(element) { const remaining=Math.max(0,routine*60-seconds); element.textContent=`${Math.floor(remaining/60)}:${String(remaining%60).padStart(2,'0')} ${running?'Ⅱ':'▶'}`; element.setAttribute('aria-label',running?'루틴 타이머 일시정지':'루틴 타이머 계속'); } }
setInterval(()=>{ if(screen!=='unit'||!running||document.hidden) return; seconds++; updateTimer(); if(seconds>=routine*60&&!timeNotified) { running=false; timeNotified=true; toast('선택한 루틴 시간이 지났어요. 진행 중인 연습을 마치거나 더 연습해도 괜찮아요.'); } },1000);
document.addEventListener('input',event=>{if(event.target.id==='answer') answerDraft=event.target.value; if(event.target.id==='topic') topic=event.target.value;});
document.addEventListener('click',event=>{

  else if(action==='phrase') { phraseIndex=phraseIndex===0?1:0; feedback=null; render(); }
  else if(action==='word'||action==='sentence') { phraseIndex=action==='word'?2:0; feedback=null; render(); }
  else if(action==='repeat') { round++; phraseIndex=round%2===0?1:0; step=0; feedback=null; audioReady=false; render(); }

  else if(action==='record') bridge('record');
  else if(action==='stopRecord') bridge('stopRecord');
  else if(action==='play') bridge('playRecord');
  else if(action==='analyze') send('shadow',true);
  else if(action==='topic') { topic=element.dataset.topic; $('topic').value=topic; }
  else if(action==='beginChat') { topic=$('topic').value.trim(); if(!topic) toast('대화하고 싶은 주제를 먼저 골라 주세요.'); else send('chat',false,true); }
  else if(action==='sendText') send('chat');
  else if(action==='sendAudio') send('chat',true);
  else if(action==='finish') {
    if(!native) { info('시안에서 연습을 마쳤어요','실제 연습 기록은 Android 앱에 저장됩니다.'); goHome(); return; }
    if(bridge('practice',{epoch:sessionEpoch}).ok) { resetSession(); refresh(); screen='summary'; render(); }
  }
  else if(action==='gate') info('실력이 확인될 때 다음 단계로','각 언어의 듣기·의미 전달·발음·문장 구성·상호작용을 따로 확인합니다. 서로 다른 상황에서 도움 없이 말할 수 있어야 합니다. 초안은 평가 기준 검수 전이라 자동 승급을 잠가 두었습니다. 연습 횟수나 경과 시간만으로는 열리지 않습니다.');
});
$('brand').onclick=goHome;
$('changeLanguage').onclick=()=>{resetSession(); screen='languages';render();};
$('settings').onclick=()=>bridge('settings');
$('leaveAdmin').onclick=()=>bridge('leaveAdmin');
$('navHome').onclick=goHome;
$('navPath').onclick=()=>{resetSession();screen=selected?'path':'languages';render();};
$('navReview').onclick=()=>{resetSession();screen=selected?'review':'languages';refresh();render();};
$('closeDialog').onclick=()=>$('infoDialog').close();
let taps=[]; let pointerStart;
document.addEventListener('pointerdown',e=>{pointerStart={x:e.clientX,y:e.clientY,t:performance.now()};});
document.addEventListener('pointerup',e=>{
  if(!pointerStart||Math.hypot(e.clientX-pointerStart.x,e.clientY-pointerStart.y)>15||performance.now()-pointerStart.t>400) return;
  if(e.target.closest('input,textarea,select,dialog')) return;
  const now=performance.now(); taps=taps.filter(t=>now-t<3000);taps.push(now);
  if(taps.length===5){taps=[];bridge('admin');}
});
window.nativeEvent=(type,result)=>{
  if(type==='notice') toast(result.message);
  else if(type==='refresh') { refresh(); if(screen==='unit') { resetSession(); screen='home'; } render(); }
  else if(type==='recording') { recording=result.active; audioReady=!!result.ready; if(screen==='unit') render(); }
  else if(type==='paused') { pending=false; recording=false; audioReady=false; running=false; if(screen==='unit') {screen='home';refresh();render();toast('연습을 일시 중단했어요. 다시 열어 이어서 연습할 수 있습니다.');} }
  else if(type==='answer'&&result.epoch===sessionEpoch) {
    pending=false;
    if(result.mode!=='shadow') answerDraft='';
    if(result.mode==='shadow') feedback=result;
    else {
      if(result.audioUsed&&result.transcript) history[history.length-1]={role:'user',text:result.transcript};
      history.push({role:'model',text:result.reply}); messages.push({role:'model',text:result.reply,meaning:result.meaning,feedback:result.feedback});
      audioReady=false;
    }
    render();
  } else if(type==='chatError'&&result.epoch===sessionEpoch) {pending=false;toast(result.message);render();}
};
(window.__curriculum?Promise.resolve(window.__curriculum):fetch('curriculum.json').then(response=>{if(!response.ok)throw Error();return response.json();})).then(result=>{data=result;refresh();render();}).catch(()=>$('main').textContent='단원 자료를 불러오지 못했습니다. 앱을 다시 실행해 주세요.');
</script></body></html>
