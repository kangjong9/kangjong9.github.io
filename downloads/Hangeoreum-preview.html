  const names={listening:'듣고 이해하기',message:'의미 전달',intelligibility:'발음 전달력',grammar:'문장 구성',interaction:'대화 이어가기',tone_meaning:'성조와 의미',word_order:'중국어 어순',mora_meaning:'모라·장단음',particles_forms:'조사와 활용'};

  if(rows.length) {
    const latest=rows[rows.length-1],weak=data[language].skills.filter(k=>Number.isInteger(latest.scores?.[k])&&latest.scores[k]<3);
    if(weak.length) {
      const focused={fr:{intelligibility:11,listening:0},zh:{tone_meaning:9,listening:0},ja:{mora_meaning:9,listening:0}}[language];
      html+=`<div class="hero"><h2>다음 연습 제안</h2><p class="muted">최근 AI 의견에서 보완을 제안한 영역입니다. 진단이나 승급 판정이 아니며 직접 연습하며 확인해 주세요.</p><div class="buttonStack">${weak.map(k=>button('targetPractice',escapeHTML(names[k]||k)+' · 기초 표현으로 연습','','data-phrase-id="'+language+'-1-'+(focused[k]??0)+'"')).join('')}</div></div>`;
    }
  }
  if(!rows.length)html+='<div class="section"><p>아직 영역별 평가 연습이 없어요.</p><p class="muted">단원에서 주제를 정하고 회화한 뒤, 내 답변을 녹음하고 ‘녹음으로 영역별 평가 연습’을 눌러 보세요.</p></div>';
  for(const row of [...rows].reverse()) {
    html+=`<section class="section"><small>${new Date(row.when).toLocaleString('ko-KR')} · ${row.stage}단계 · 연습 평가</small>`;
    for(const key of data[language].skills) { const value=row.scores?.[key]; html+=`<p><b>${names[key]||key}</b> — ${value===null||value===undefined?'판단 보류':escapeHTML(value)+' / 4 · 참고 의견'}</p>`; }
    html+=`<div class="feedback">${escapeHTML(row.feedback)}</div></section>`;

  return html+button('start','연습하러 가기','primary wide');
}


// 표현별 자기회상과 듣기 복습. 이 기록은 단계 합격 증거가 아니다.
function markStudied() {
  if(!native)return true;const result=bridge('studied',{epoch:sessionEpoch,phraseIndex,phraseId:unit().phrases[phraseIndex].id});if(result.ok)refresh();return result.ok;
}
function cardEntries() {
  const cards=state.progress[language].cards||{};
  return Object.entries(cards).flatMap(([key,c])=>{
    if(!['recall','listening'].includes(c.mode)||!Number.isInteger(c.stage)||c.stage<1||c.stage>10||(!state.admin&&c.stage>unlockedStage()))return [];
    const u=data[language].units[c.stage-1],p=u.phrases.find(p=>p.id===c.phraseId);
    return p?[{...c,key,p}]:[];
  });
}
function dueCards() {
  return cardEntries().filter(c=>Number.isFinite(c.due)&&c.due<=Date.now()).sort((a,b)=>Number(b.lastOutcome==='again')-Number(a.lastOutcome==='again')||a.due-b.due||a.key.localeCompare(b.key));
}
function renderReviewList() {
  const cards=cardEntries(),due=dueCards();
  let html=`<div class="eyebrow">${data[language].name} 표현별 복습</div><h1>뜻을 떠올리고,<br>소리로 다시 만나요.</h1><p class="muted">말을 떠올리는 기억과 듣고 뜻을 아는 기억은 따로 기록해요. 자기 확인 기록이며 발음 합격이나 승급 판정이 아닙니다.</p>`;
  if(due.length)html+=`<div class="hero"><h2>오늘 복습 ${due.length}개</h2><p>${routine}분 · 이전 복습 소요시간에 맞춰, 어려웠던 표현부터</p>${button('reviewQueue','오늘 복습 시작','primary wide')}</div>`;
  if(!cards.length)html+=`<div class="empty">아직 표현별 기록이 없어요. 표현을 끝까지 듣거나 녹음한 뒤 반복 연습을 마치면 여기에 남아요.</div>${button('start','표현 연습하기','primary wide')}`;
  for(const c of cards.sort((a,b)=>a.due-b.due))html+=`<section class="section"><span class="tag">${c.mode==='recall'?'뜻 보고 말 떠올리기':'소리 듣고 뜻 떠올리기'}</span><h3>${c.mode==='listening'?'소리로 뜻 확인하기':escapeHTML(c.p.meaning)}</h3><p class="muted">${c.due<=Date.now()?'오늘 복습':new Date(c.due).toLocaleDateString('ko-KR')+' 복습 예정'}${c.lastOutcome==='again'?' · 다시 연습할 표현':''}</p>${button('reviewCard','정답 가리고 연습','wide',`data-key="${escapeHTML(c.key)}"`)}</section>`;
  if(Object.keys(state.progress[language].reviews||{}).length)html+='<p class="muted section">이전 버전의 단원 연습 기록은 보관했습니다. 어떤 표현을 기억했는지 알 수 없어 개별 표현의 성공 기록으로 옮기지 않았어요.</p>';
  return html;
}
function startRecallQueue(key) {
  if(!native){bridge('recallBegin');return;}
  refresh();const available=key?cardEntries().filter(c=>c.key===key):dueCards();
  recallQueue=[];let budget=routine*60;const queuedIds=new Set();for(const c of available){if(queuedIds.has(c.phraseId))continue;const estimate=Math.max(5,Math.min(180,Number(c.estimatedSeconds)||30));if(recallQueue.length&&estimate>budget)break;recallQueue.push(c);queuedIds.add(c.phraseId);budget-=estimate;if(budget<=0||recallQueue.length>=30)break;}recallPosition=0;recallResults=[];
  if(!recallQueue.length){toast('지금 복습할 표현이 없어요.');return;}
  seconds=0;timeNotified=false;running=true;openRecallCard();
}
function openRecallCard() {
  const c=recallQueue[recallPosition],wasRunning=running;
  resetSession();const opened=bridge('open',{language,stage:c.stage});
  if(!opened.ok){screen='review';refresh();render();return;}
  sessionEpoch=opened.epoch;unitIndex=c.stage-1;
  const r=bridge('recallBegin',{epoch:sessionEpoch,phraseId:c.phraseId,mode:c.mode});
  if(!r.ok){goHome();return;}
  recallToken=r.token;recallStartSeconds=seconds;recallRevealed=false;recallCanRemember=false;recallHeard=false;screen='recall';running=wasRunning;render();
}
function renderRecall() {
  const c=recallQueue[recallPosition];
  let html=`<div class="unitHead"><span class="eyebrow">${recallPosition+1} / ${recallQueue.length} · ${c.mode==='recall'?'뜻 보고 말하기':'소리 듣고 이해하기'}</span><button class="quiet timer" data-action="pause" id="timer"></button></div><h1>${c.mode==='recall'?'이 뜻을 어떻게<br>말할까요?':'듣고, 어떤 뜻인지<br>떠올려 보세요.'}</h1>`;
  if(!recallRevealed) {
    html+=c.mode==='recall'?`<div class="hero"><h2>${escapeHTML(c.p.meaning)}</h2></div><p class="muted">정답을 보기 전에 소리 내어 말해 보세요. 발음 검사는 다음 따라 말하기 연습에서 할 수 있어요.</p>`:`${illustration('help')}${button('recallListen','▶ 표현 듣기','primary wide')}<p class="muted">${recallHeard?'표현을 끝까지 들었어요. 뜻을 떠올려 보세요.':'표현을 끝까지 들어야 기억 확인을 할 수 있어요.'}</p>`;
    html+=`<div class="buttonStack">${button('recallReveal',c.mode==='recall'?'떠올렸어요 · 정답 확인':'뜻을 떠올렸어요 · 정답 확인','primary',c.mode==='listening'&&!recallHeard?'disabled':'')}${button('recallHint','도움이 필요해요 · 정답 보기')}</div>`;
  } else {
    html+=`<div class="phrase"><div class="target">${escapeHTML(c.p.text)}</div><div class="reading">${escapeHTML(c.p.reading||'')}</div><p>${escapeHTML(c.p.meaning)}</p></div><div class="hint">${escapeHTML(c.p.tip||'')}</div><p class="muted">${recallCanRemember?'먼저 떠올린 답과 비교해 주세요.':'도움을 보았거나 최근 24시간 안에 정답을 확인한 표현은 기억 성공으로 기록하지 않아요.'}</p><div class="buttonStack">${recallCanRemember?button('recallRate','맞게 떠올렸어요','primary','data-outcome="remembered"'):''}${button('recallRate','다시 연습할래요','','data-outcome="again"')}${button('recallRate','음성·상황 문제로 판단 보류','quiet','data-outcome="unassessable"')}</div>`;
  }
  return html+`<div class="section">${button('recallStop','여기까지 · 나머지는 남겨 두기','wide')}</div>`;
}
function rateRecall(outcome) {
  const r=bridge('recallRate',{epoch:sessionEpoch,token:recallToken,outcome,activeSeconds:seconds-recallStartSeconds});if(!r.ok)return;
  recallResults.push({outcome,testOnly:!!r.testOnly});recallPosition++;refresh();
  if(recallPosition>=recallQueue.length||timeNotified)endRecallQueue();else openRecallCard();
}
function endRecallQueue() {resetSession();refresh();screen='recallSummary';render();}
function renderRecallSummary() {
  const count=outcome=>recallResults.filter(r=>r.outcome===outcome).length;
  return `<div class="eyebrow">${data[language].name} · 오늘 복습</div><h1>확인한 만큼만<br>기록했어요.</h1><p>기억났어요 ${count('remembered')}개 · 다시 연습 ${count('again')}개 · 판단 보류 ${count('unassessable')}개</p><p class="muted">${Math.max(0,recallQueue.length-recallPosition)}개는 아직 확인하지 않았어요. 판단 보류와 미완료 항목은 원래 일정 그대로 남습니다. 같은 날 반복하거나 예정일 전에 기억했다고 눌러도 간격은 늘지 않아요.</p>${recallResults.some(r=>r.testOnly)?'<div class="hint">관리자 테스트 결과는 실제 기록에 저장하지 않았어요.</div>':''}${button('home','오늘 화면으로','primary wide')}`;
}


function startCurrentLesson() {
  const saved=state.progress[language].checkpoint;
  if(saved?.stage>=1&&saved.stage<=unlockedStage()){openUnit(saved.stage-1,true);return;}
  const lessons=data[language].units[unlockedStage()-1].lessons||[];
  const next=lessons.find(l=>!lessonComplete(l))||lessons[0];
  openUnit(unlockedStage()-1,false,false,next?.id||'');
}
function showLessons(index) {
  if(index>=unlockedStage()&&!state.admin){openUnit(index);return;}
  resetSession();unitIndex=index;lessonId='';screen='lessons';refresh();render();
}
function renderLessons() {
  const u=unit();
  let html=`<div class="eyebrow">${data[language].name} · ${unitIndex+1}단계</div><h1>작은 단원으로,<br>하나씩 익혀요.</h1><p class="muted">${escapeHTML(u.title)}. 표현을 끝까지 듣거나 따라 녹음하고 회차를 마치면 단원에 쌓입니다. 단원 완료는 실력 합격이나 승급이 아닙니다.</p>`;
  for(const l of u.lessons||[]) {
    const saved=state.progress[language].lessons?.[l.id],done=(saved?.practiced||[]).filter(id=>l.phraseIds.includes(id)).length;
    html+=`<section class="section"><span class="tag">${state.admin?'관리자 테스트':done===l.phraseIds.length?'표현 연습 완료':done?'연습 중':'시작 전'}</span><h2>${escapeHTML(l.title)}</h2><p>${escapeHTML(l.goal)}</p><p class="muted">${state.admin?'실제 기록과 분리':done+' / '+l.phraseIds.length+'개 표현 연습'}</p>${button('lesson','이 단원 연습하기','primary wide',`data-lesson="${escapeHTML(l.id)}"`)}</section>`;
  }
  return html+`<div class="section">${button('allPhrases','이 단계 전체 표현 살펴보기','wide')}</div>`;
}
function nextLesson() {
  const lessons=unit().lessons||[],index=lessons.findIndex(l=>l.id===lessonId);
  if(index<0||index+1>=lessons.length)return null;
  if(!state.admin&&!lessonComplete(lessons[index]))return null;
  return lessons[index+1];
}
function renderLessonSummary() {
  const l=lesson(),record=state.progress[language].lessons?.[lessonId],next=nextLesson();
  const done=l?(record?.practiced||[]).filter(id=>l.phraseIds.includes(id)).length:0;
  return `<div class="eyebrow">오늘의 한걸음</div><h1>이번 회차를 마쳤어요.</h1>${!state.admin&&!lastPracticeSaved?'<div class="hint">이번 회차에서 저장할 표현 연습이 없었어요. 듣기나 따라 녹음을 마친 표현만 기록합니다.</div>':''}${illustration('park')}<h2>${escapeHTML(l?.title||unit().title)}</h2><p>${state.admin?'관리자 테스트는 실제 기록에 반영하지 않았어요.':l?done+' / '+l.phraseIds.length+'개 표현을 연습했어요.':'실제 듣거나 따라 녹음한 표현만 복습 노트에 남겼어요.'}</p><p class="muted">${l&&!lessonComplete(l)&&!state.admin?'아직 연습하지 않은 표현은 다음 회차에 이어집니다. ':''}단원 연습 완료와 단계 통과는 달라요.</p><div class="buttonStack">${next?button('nextLesson','다음 단원 · '+escapeHTML(next.title)+' →','primary'):button('startAgain','이 단원 이어서 연습','primary')}${button('home','오늘 화면으로')}${button('lessons','작은 단원 목록')}</div>`;
}

function openExams(){resetSession();exam=null;attempts=[];screen='exams';examRequest('examList');}

  if(pending||recording)return;

  if(result.ok){sessionEpoch=result.epoch;pending=true;}else pending=false;
  render();

 const rows=attempts.filter(a=>a.language===language);

 if(!rows.length&&!pending)html+='<p class="section">아직 확인된 시험 기록이 없어요. 서버 연결은 설정에서 할 수 있습니다.</p>';
 for(const row of rows){

  html+=`<section class="section"><span class="tag">${escapeHTML(label)}</span><h2>${Number(row.stage)}단계</h2><p class="muted">${escapeHTML(new Date(row.created*1000).toLocaleString('ko-KR'))}</p>${row.feedback?`<div class="feedback">${escapeHTML(row.feedback)}</div>`:''}${row.scores?`<p>영역별 결과: ${Object.entries(row.scores).map(([k,v])=>escapeHTML(({listening:'듣기',message:'의미 전달',intelligibility:'발음 명료도',grammar:'문법',interaction:'상호 대화',tone_meaning:'성조와 의미',word_order:'어순',mora_meaning:'음의 길이와 의미',particles_forms:'조사와 활용'})[k]||k)+' '+(v===null?'판단 보류':Number(v)+'/4')).join(' · ')}</p>`:''}${row.status==='recording'?button('examResume','이 시험 이어하기','wide',`data-challenge="${escapeHTML(row.id)}" ${pending?'disabled':''}`):''}</section>`;
 }
 return html;

function renderExam(){
 if(!exam)return '';
 return `<div class="eyebrow">${escapeHTML(data[language].name)} · ${Number(exam.stage)}단계</div><h1>내 말로 답해 보세요.</h1><div class="phrase"><p>${escapeHTML(exam.prompt.instruction)}</p></div>${exam.prompt.listenText?button('examListen','▶ 문제 음성 듣기','wide',recording||pending?'disabled':''):''}<p class="muted">응시 기한: ${escapeHTML(new Date(exam.expires*1000).toLocaleTimeString('ko-KR'))}. 최대 30초로 답변을 녹음해 주세요.</p><div class="row">${button(recording?'stopRecord':'examRecord',recording?'■ 녹음 끝내기':'● 시험 답변 녹음',recording?'recording':'primary',pending?'disabled':'')}${button('play','내 답변 듣기','',!audioReady||recording||pending?'disabled':'')}</div><p role="status">${recording?'녹음 중':audioReady?'답변이 준비됐어요. 다시 녹음할 수도 있습니다.':'녹음은 제출 전까지 기기에만 있어요.'}</p><div class="section"><label><input id="examConsent" type="checkbox" ${examConsent?'checked':''}> 이 답변 음성을 시험 서버에 보관하고 권한 있는 평가자가 듣고 채점하는 데 동의합니다.</label></div><p class="muted">이 제출은 Google AI에 전송되지 않습니다. 제출 후에는 답변을 교체할 수 없습니다.</p>${button('examSend',pending?'제출 확인 중…':'답변 제출','primary wide',!audioReady||recording||pending?'disabled':'')}<div class="section">${button('exams','시험 목록으로','wide',pending||recording?'disabled':'')}</div>`;
}
